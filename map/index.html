<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#eff6ff">
    <title>一切开始的地方</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, #eff6ff, #e0e7ff);
        }

        .card {
            text-align: center;
            background: #fff;
            padding: 2.5rem 3rem;
            border-radius: 0.75rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            max-width: 24rem;
        }

        .heart {
            font-size: 2.5rem;
            color: #e11d48;
            line-height: 1;
        }

        h1 {
            margin: 0.75rem 0 0.5rem;
            font-size: 1.5rem;
            font-weight: normal;
            color: #3730a3;
        }

        p {
            margin: 0.25rem 0;
            font-size: 1rem;
            color: #6b7280;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="heart">&#9829;</div>
    <h1>一切开始的地方</h1>
    <p>此页面暂时关闭，敬请期待。</p>
</div>
</body>
</html>
