<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fce7f3">
    <meta name="description" content="猪猪与猪猪的爱情故事——从相遇到相知，一起走过的每一步。">
    <meta property="og:title" content="我们的故事">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://yad.lzc.app/">
    <meta property="og:description" content="从相遇到相知，一起走过的每一步。">
    <meta name="twitter:card" content="summary">
    <title>我们的故事</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        @font-face {
            font-family: 'ZCOOL KuaiLe';
            src: url('./assets/fonts/ZCOOLKuaiLe-Regular.woff2') format('woff2'),
                 url('./assets/fonts/ZCOOLKuaiLe-Regular.woff') format('woff');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --font-cn: 'ZCOOL KuaiLe', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
            --red-500: #ef4444;
            --red-400: #f87171;
            --red-600: #dc2626;
            --rose-800: #9f1239;
            --gray-800: #1f2937;
            --gray-600: #4b5563;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: var(--font-cn);
            text-align: center;
            color: var(--gray-800);
            background: linear-gradient(135deg, #fce7f3, #fecaca);
        }

        .site-header {
            padding: 2.5rem 1.25rem;
            background: rgba(255, 255, 255, 0.7);
            border-bottom: 2px solid #fbcfe8;
        }

        .site-header h1 {
            margin: 0;
            font-size: 2.5rem;
            font-weight: normal;
            color: var(--rose-800);
        }

        .site-header .lovers {
            margin: 0;
            font-size: 2.25rem;
            font-weight: normal;
            color: var(--red-500);
        }

        .site-header .tagline {
            margin: 1rem 0 0;
            font-size: 1.875rem;
            font-weight: normal;
            color: var(--gray-600);
        }

        .card {
            max-width: 36rem;
            margin: 2.5rem auto;
            background: rgba(255, 255, 255, 0.8);
            padding: 1.5rem;
            border-radius: 0.75rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            margin: 0 0 1rem;
            font-size: 1.875rem;
            font-weight: normal;
            color: var(--red-400);
        }

        .card p {
            margin: 0;
            font-size: 1.5rem;
            line-height: 1.625;
        }

        .card p + p { margin-top: 0.5rem; }

        .quote { font-style: italic; }

        .site-footer {
            margin-top: 2.5rem;
            padding: 1.25rem;
            font-size: 1.5rem;
            color: #fff;
            background: rgba(0, 0, 0, 0.2);
        }

        #popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 50;
            max-width: 24rem;
            width: calc(100% - 2rem);
            padding: 2rem;
            background: #fff;
            border-radius: 0.75rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            text-align: center;
        }

        #popup h2 { margin: 0 0 1rem; font-size: 2.25rem; color: var(--red-500); }
        #popup p  { margin: 0 0 1rem; font-size: 1.25rem; }

        #popup button {
            margin-top: 1rem;
            padding: 0.5rem 1.5rem;
            background: var(--red-500);
            color: #fff;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            font-family: inherit;
            font-size: 1rem;
        }

        #popup button:hover { background: var(--red-600); }

        #popup button:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.5);
        }

        @media (min-width: 768px) {
            .site-header { padding: 4rem 2.5rem; }
            .site-header h1 { font-size: 3rem; }
            .site-header .lovers { font-size: 3rem; }
            .site-header .tagline { font-size: 2.25rem; }
            .card { margin: 4rem auto; padding: 2rem; }
            .card h2 { font-size: 2.25rem; }
            .card p { font-size: 1.875rem; }
        }

        @media (min-width: 1024px) {
            .site-header h1 { font-size: 4.5rem; }
            .site-header .lovers { font-size: 3.75rem; }
        }
    </style>
</head>
<body>
<header class="site-header">
    <h1>我们的故事</h1>
    <h2 class="lovers">
        这是
        <ruby>
            猪猪<rt>yad</rt>
        </ruby>
        &amp;
        <ruby>
            猪猪<rt>lzc</rt>
        </ruby>
        的爱情
    </h2>
    <p class="tagline">从相遇到相知，一起走过的每一步</p>
</header>

<section class="card">
    <h2>我们已经在一起</h2>
    <p><span id="time"></span></p>
</section>

<section class="card">
    <h2>猪猪语录</h2>
    <p class="quote">“再走走，一起一直走下去！”</p>
    <p class="quote">“不唯上，不唯书，只唯猪”</p>
    <p class="quote">“永远童真！”</p>
</section>

<section class="card">
    <h2>写给彼此的一封信</h2>
    <p>
        亲爱的猪猪，感谢上苍，能在茫茫人海中遇见你。
        <br/>
        让我知道，原来世界上真的有如此美好的人存在。
        <br/>
        未来的路还很长，还有很多的可能性。
        <br/>
        但我知道，有你就已经足够。
    </p>
</section>

<footer class="site-footer">
    <p>© 2025 我们的爱情故事 | 永远爱你 ❤️</p>
</footer>

<div id="popup">
    <h2>520快乐❤️</h2>
    <p>亲爱的猪猪，节日快乐！</p>
    <button type="button" aria-label="关闭弹窗" onclick="document.getElementById('popup').style.display='none'">关闭</button>
</div>

<script>
    const startDate = new Date("2025-04-26T21:26:00");
    const timeEl = document.getElementById("time");

    function updateCountdown() {
        const now = new Date();
        const diff = now - startDate;

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const minutes = Math.floor((diff / (1000 * 60)) % 60);
        const seconds = Math.floor((diff / 1000) % 60);

        timeEl.textContent = days + " 天 " + hours + " 小时 " + minutes + " 分 " + seconds + " 秒";
    }

    function isSpecialDate() {
        const now = new Date();
        const mmdd = (now.getMonth() + 1).toString().padStart(2, '0') + now.getDate().toString().padStart(2, '0');
        return mmdd === '0520'; // Checks for May 20th
    }

    if (isSpecialDate()) {
        setTimeout(() => {
            document.getElementById("popup").style.display = 'block';
        }, 1000);
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
</script>
</body>
</html>
